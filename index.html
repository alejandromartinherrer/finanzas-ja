<!doctype html>
<html lang="es" data-tema="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<title>Finanzas J&amp;A</title>
<style>
:root {
  color-scheme: light;
  /* superficie e tinta (modo claro) */
  --fondo: #f9f9f7; --superficie: #fcfcfb;
  --tinta: #1a1a18; --tinta2: #52514e; --tinta3: #6f6d66;
  --rejilla: #e8e7e1; --eje: #c3c2b7; --linea: rgba(11,11,11,.10);
  /* COLOR CON SIGNIFICADO — la asignación es fija en todo el panel:
     verde entra · rojo sale · azul se mueve hacia el futuro ·
     ámbar deuda que se hace propiedad · gris no es dinero, es una opinión.
     Validado con scripts/validate_palette.js de la skill dataviz en los dos
     modos (peor par bajo daltonismo: verde↔rojo, con separación espacial,
     leyenda, etiquetas directas y vista de tabla como canales de apoyo). */
  --ingreso: #008300;       /* verde  · ingresos                             */
  --gasto:   #e34948;       /* rojo   · gasto y deudas                       */
  --inver:   #2a78d6;       /* azul   · inversión y dinero nuevo             */
  --amort:   #c98500;       /* ámbar  · amortización de deuda                */
  --valora:  #7a776f;       /* gris   · cambio de valoración (no es dinero)  */
  --acento:  #2a78d6;       /* azul   · interfaz: foco, selección, enlaces   */
  --patri-total: #6da7ec;   /* azul claro · patrimonio total (contexto)      */
  /* media tinta del verde: la muestra de leyenda del segundo libro tiene que
     ser el mismo color que pinta el gráfico, no un gris inventado */
  --medio-ingreso: rgba(0,131,0,.5);
  --bien: #006300; --mal: #c53030;   /* texto de deltas, con signo al lado   */
  --wash1: rgba(42,120,214,.10); --wash2: rgba(237,161,0,.14); --wash3: rgba(0,131,0,.10);
  /* tipografía: escala corta de cuatro tamaños */
  --f0: .8125rem; --f1: .9375rem; --f2: 1.25rem; --f3: clamp(2rem, 3.4vw, 2.6rem);
  --u: 8px;                 /* unidad de espaciado */
  --radio: 6px;
}
:root[data-tema="oscuro"] { color-scheme: dark;
  --fondo: #0d0d0d; --superficie: #1a1a19;
  --tinta: #f2f1ec; --tinta2: #c3c2b7; --tinta3: #a3a199;
  --rejilla: #262624; --eje: #383835; --linea: rgba(255,255,255,.12);
  --ingreso: #008300; --gasto: #e66767; --inver: #3987e5;
  --amort: #c98500; --valora: #c3c2b7; --acento: #3987e5; --patri-total: #1c5cab;
  --medio-ingreso: rgba(0,131,0,.5);
  --bien: #35b535; --mal: #ef7070;
  --wash1: rgba(57,135,229,.16); --wash2: rgba(201,133,0,.18); --wash3: rgba(0,131,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) { color-scheme: dark;
    --fondo: #0d0d0d; --superficie: #1a1a19;
    --tinta: #f2f1ec; --tinta2: #c3c2b7; --tinta3: #a3a199;
    --rejilla: #262624; --eje: #383835; --linea: rgba(255,255,255,.12);
    --ingreso: #008300; --gasto: #e66767; --inver: #3987e5;
    --amort: #c98500; --valora: #c3c2b7; --acento: #3987e5; --patri-total: #1c5cab;
  --medio-ingreso: rgba(0,131,0,.5);
    --bien: #35b535; --mal: #ef7070;
    --wash1: rgba(57,135,229,.16); --wash2: rgba(201,133,0,.18); --wash3: rgba(0,131,0,.18);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--fondo); color: var(--tinta);
  font: 400 var(--f1)/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*10);
}
main { max-width: 1080px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 2px; }
::selection { background: var(--wash1); }
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------------------------------------------------------- encabezado --- */
header.principal { display: flex; flex-wrap: wrap; align-items: baseline; gap: calc(var(--u)*2);
  max-width: 1080px; margin: 0 auto calc(var(--u)*3); }
header.principal h1 { font-size: var(--f2); font-weight: 650; letter-spacing: -.01em; }
header.principal .fecha { color: var(--tinta3); font-size: var(--f0); }
header.principal .relleno { flex: 1; }

.selector-tema { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; padding: 2px; }
.selector-tema button { font-size: var(--f0); color: var(--tinta3); padding: 2px 10px; border-radius: 999px; }
.selector-tema button[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); }

/* ------------------------------------------------------ control periodo --- */
nav.periodo { position: sticky; top: 0; z-index: 30; background: var(--fondo);
  max-width: 1080px; margin: 0 auto calc(var(--u)*5);
  padding: calc(var(--u)*1.5) 0; display: flex; flex-wrap: wrap; gap: var(--u); align-items: center;
  border-bottom: 1px solid var(--rejilla); }
nav.periodo .grupo { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 2px; }
nav.periodo button.opcion { font-size: var(--f0); padding: 3px 10px; border-radius: 4px; color: var(--tinta2); white-space: nowrap; }
nav.periodo button.opcion:hover { background: var(--wash1); }
nav.periodo button.opcion[aria-pressed="true"] { background: var(--acento); color: #fff; }
nav.periodo select, nav.periodo input[type="date"] {
  font: inherit; font-size: var(--f0); color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 4px; padding: 3px 6px; }
nav.periodo .rango-fechas { display: none; gap: var(--u); align-items: center; font-size: var(--f0); color: var(--tinta3); }
nav.periodo .rango-fechas.visible { display: inline-flex; }
nav.periodo .resumen { margin-left: auto; font-size: var(--f0); color: var(--tinta3); }

/* -------------------------------------------------------------- avisos --- */
.avisos { margin: 0 0 calc(var(--u)*4); display: grid; gap: var(--u); }
.avisos p { font-size: var(--f0); color: var(--tinta2); padding: var(--u) calc(var(--u)*1.5);
  border-left: 3px solid var(--amort); background: var(--wash2); border-radius: 0 var(--radio) var(--radio) 0; }

/* ------------------------------------------------------------ secciones --- */
main { counter-reset: seccion; }
section { margin: 0 0 calc(var(--u)*10); }
section > h2 { font-size: var(--f0); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tinta3); margin-bottom: calc(var(--u)*3);
  border-top: 1px solid var(--rejilla); padding-top: calc(var(--u)*2); }
section > h2::before { counter-increment: seccion; content: counter(seccion, decimal-leading-zero);
  font-weight: 400; letter-spacing: .04em; margin-right: calc(var(--u)*1.5); opacity: .6;
  font-variant-numeric: tabular-nums; }
.explica { font-size: var(--f0); color: var(--tinta3); max-width: 62ch; margin-bottom: calc(var(--u)*2); }

/* ---------------------------------------------------------- diagnóstico --- */
.diagnostico { font-size: var(--f2); line-height: 1.55; max-width: 72ch; color: var(--tinta2);
  letter-spacing: -.005em; margin: calc(var(--u)*1) 0 calc(var(--u)*2); }
.diagnostico strong { color: var(--tinta); font-weight: 650; white-space: nowrap; }
.diagnostico .mal { color: var(--mal); } .diagnostico .bien { color: var(--bien); }
button.enlace-puerta { display: inline; font: inherit; color: inherit; padding: 0;
  border-bottom: 1px dashed var(--eje); border-radius: 0; }
button.enlace-puerta:hover, button.enlace-puerta:focus-visible { color: var(--acento); border-bottom-color: var(--acento); }

/* -------------------------------------------------------------- objetivo --- */
.objetivo { margin-top: calc(var(--u)*4); padding-top: calc(var(--u)*2.5); border-top: 1px solid var(--rejilla); }
.objetivo-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--u); justify-content: space-between; }
.objetivo-titulo { font-size: var(--f0); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta3); }
.objetivo-cifra { font-size: var(--f2); font-weight: 650; font-variant-numeric: tabular-nums; }
.objetivo-cifra .sec { font-size: var(--f1); font-weight: 400; color: var(--tinta3); }
.objetivo-pista { position: relative; height: 8px; border-radius: 4px; background: var(--rejilla);
  margin: calc(var(--u)*1.5) 0 var(--u); overflow: hidden; }
.objetivo-relleno { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--acento); min-width: 3px; }
.objetivo-relleno.corto { background: var(--mal); }
.objetivo-pie { font-size: var(--f0); color: var(--tinta2); max-width: 76ch; }
.objetivo-pie strong { color: var(--tinta); }

/* ------------------------------------------------------------ simulador --- */
.simulador { margin-top: calc(var(--u)*5); padding-top: calc(var(--u)*3); border-top: 1px solid var(--rejilla); }
.simulador-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--u); justify-content: space-between; margin-bottom: calc(var(--u)*2); }
.simulador-cab h3 { font-size: var(--f0); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta3); }
.simulador-control { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u)*2); margin-bottom: calc(var(--u)*3); }
.simulador-control label { font-size: var(--f0); color: var(--tinta2); }
.simulador-control input[type="range"] { flex: 1 1 220px; min-width: 160px; accent-color: var(--acento);
  height: 22px; background: transparent; }
.simulador-control .renta-actual { font-size: var(--f3); font-weight: 650; letter-spacing: -.02em;
  font-variant-numeric: normal; min-width: 5ch; }
.simulador-control .renta-actual .unidad { font-size: var(--f1); font-weight: 400; color: var(--tinta3); }
.simulador-control button.reset { font-size: var(--f0); color: var(--tinta3); text-decoration: underline dotted; }
.simulador-control button.reset:hover { color: var(--acento); }
.simulador-salidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*3); }
.simulador-salidas .caja .etiqueta { font-size: var(--f0); color: var(--tinta3); display: block; }
.simulador-salidas .caja .cifra { font-size: var(--f2); font-weight: 650; font-variant-numeric: tabular-nums; }
.simulador-salidas .caja .delta { font-size: var(--f0); display: block; }
.bandas { margin-top: calc(var(--u)*3); }
.bandas-pista { position: relative; height: 6px; border-radius: 3px; background: var(--rejilla); margin: calc(var(--u)*3) 0 var(--u); }
.bandas-zona { position: absolute; top: 0; bottom: 0; background: var(--wash1); }
.bandas-marca { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--tinta3); }
.bandas-aguja { position: absolute; top: -7px; bottom: -7px; width: 3px; background: var(--acento); border-radius: 2px; }
.bandas-aguja::after { content: attr(data-txt); position: absolute; left: 50%; transform: translateX(-50%);
  top: -20px; font-size: var(--f0); font-weight: 600; color: var(--acento); white-space: nowrap; }
.bandas-eje { display: flex; justify-content: space-between; font-size: var(--f0); color: var(--tinta3); }
@media (max-width: 480px) { .simulador-salidas { grid-template-columns: 1fr; gap: var(--u); } }

/* ------------------------------------------------------------ sparklines --- */
.kpi .chispa { display: block; margin-top: calc(var(--u)*1); height: 26px; }
.kpi .chispa svg { display: block; }
.medidor { display: block; margin-top: calc(var(--u)*1.25); width: 116px; height: 6px;
  border-radius: 3px; background: var(--rejilla); position: relative; overflow: hidden; }
.medidor .relleno-medidor { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }

/* ayuda con puntitos: el término explica qué es al pasar el ratón / tocar */
[data-ayuda] { text-decoration: underline dotted var(--tinta3); text-underline-offset: 3px; cursor: help; }
#globo { position: fixed; z-index: 90; max-width: 300px; background: var(--tinta); color: var(--fondo);
  font-size: var(--f0); line-height: 1.45; padding: calc(var(--u)*1.25) calc(var(--u)*1.5);
  border-radius: var(--radio); pointer-events: none; opacity: 0; transition: opacity .12s; }
#globo.visible { opacity: 1; }
#globo strong { display: block; margin-bottom: 2px; }

/* ------------------------------------------------------------ tarjetas --- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*3); }
.kpi { text-align: left; padding: 0; border-radius: var(--radio); }
button.kpi:hover .valor { color: var(--acento); }
.kpi .etiqueta { font-size: var(--f0); color: var(--tinta3); display: inline-block; margin-bottom: 2px; }
.kpi .valor { font-size: var(--f3); font-weight: 650; letter-spacing: -.02em; line-height: 1.15;
  font-variant-numeric: normal; }
.kpi .detalle { font-size: var(--f0); color: var(--tinta2); margin-top: 2px; }
.kpi .delta { font-size: var(--f0); font-weight: 600; }
.delta.bien { color: var(--bien); } .delta.mal { color: var(--mal); } .delta.neutro { color: var(--tinta3); }

/* ------------------------------------------------------------- gráficos --- */
.grafico { position: relative; }
.grafico svg text { font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif;
  fill: var(--tinta3); font-variant-numeric: tabular-nums; }
.grafico svg .titulo-serie { font-weight: 600; fill: var(--tinta2); }
.cabecera-grafico { display: flex; align-items: baseline; flex-wrap: wrap; gap: calc(var(--u)*2); margin-bottom: var(--u); }
.leyenda { display: flex; flex-wrap: wrap; gap: calc(var(--u)*2); font-size: var(--f0); color: var(--tinta2); }
.leyenda .clave { display: inline-flex; align-items: center; gap: 6px; }
.leyenda .muestra { width: 12px; height: 12px; border-radius: 3px; }
.leyenda .muestra.linea { height: 3px; border-radius: 2px; }
.conmutador { display: inline-flex; gap: 2px; border: 1px solid var(--linea); border-radius: var(--radio); padding: 2px; }
.conmutador button { font-size: var(--f0); padding: 3px 10px; border-radius: 4px; color: var(--tinta2); white-space: nowrap; }
.conmutador button:hover { background: var(--wash1); }
.conmutador button[aria-pressed="true"] { background: var(--acento); color: #fff; }
.ver-tabla { font-size: var(--f0); color: var(--tinta3); text-decoration: underline dotted; margin-left: auto; }
.ver-tabla:hover { color: var(--acento); }
#tooltip-marca { position: fixed; z-index: 80; pointer-events: none; background: var(--superficie);
  border: 1px solid var(--linea); border-radius: var(--radio); padding: var(--u) calc(var(--u)*1.5);
  font-size: var(--f0); opacity: 0; transition: opacity .1s; box-shadow: none; min-width: 150px; }
#tooltip-marca.visible { opacity: 1; }
#tooltip-marca .titulo { color: var(--tinta3); margin-bottom: 4px; }
#tooltip-marca .fila { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tooltip-marca .fila .nombre { color: var(--tinta2); display: inline-flex; align-items: center; gap: 6px; }
#tooltip-marca .fila .clave-linea { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
#tooltip-marca .fila .cifra { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tinta); }
.marca-interactiva { cursor: pointer; }
.marca-interactiva:hover { filter: brightness(1.12); }

/* --------------------------------------------------------------- tablas --- */
table.datos { width: 100%; border-collapse: collapse; font-size: var(--f0); }
table.datos th { text-align: left; font-weight: 600; color: var(--tinta3); padding: 6px 10px 6px 0;
  border-bottom: 1px solid var(--eje); white-space: nowrap; cursor: pointer; user-select: none; }
table.datos th.num, table.datos td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.datos td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rejilla); vertical-align: baseline; }
table.datos tr.clicable { cursor: pointer; }
table.datos tr.clicable:hover td { background: var(--wash1); }
table.datos tfoot td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--eje); }
table.datos .sec { color: var(--tinta3); }
.neg { color: var(--tinta); } .num .signo-neg { }

/* ------------------------------------------------------- filas con barra --- */
.filas-barra { display: grid; gap: 6px; }
.fila-barra { display: grid; grid-template-columns: minmax(110px, 15ch) 1fr auto auto; gap: calc(var(--u)*1.5);
  align-items: center; padding: 2px 0; border-radius: 4px; text-align: left; font-size: var(--f0); }
button.fila-barra:hover { background: var(--wash1); }
.fila-barra .nombre { color: var(--tinta2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-barra .pista { position: relative; height: 14px; }
.fila-barra .relleno { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--acento); min-width: 2px; }
.fila-barra .marca-previa { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta3); }
.fila-barra .importe { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.fila-barra .delta { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 7ch; text-align: right; }
.subtotal { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--f0);
  color: var(--tinta3); margin: calc(var(--u)*2) 0 var(--u); border-bottom: 1px solid var(--rejilla); padding-bottom: 4px; }
.subtotal strong { color: var(--tinta2); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ dos columnas - */
.dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*5); align-items: start; }
.tres-columnas { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*3); align-items: start; }

/* ---------------------------------------------------------------- deuda --- */
.hipoteca h3 { font-size: var(--f1); font-weight: 650; margin-bottom: 2px; }
.hipoteca .grande { font-size: var(--f2); font-weight: 650; letter-spacing: -.01em; }
.hipoteca dl { display: grid; grid-template-columns: auto auto; gap: 2px calc(var(--u)*2);
  font-size: var(--f0); margin-top: var(--u); }
.hipoteca dt { color: var(--tinta3); } .hipoteca dd { text-align: right; font-variant-numeric: tabular-nums; }
.barra-cuota { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: var(--u) 0 4px; gap: 2px; }
.barra-cuota .amort { background: var(--amort); border-radius: 4px 0 0 4px; }
.barra-cuota .inter { background: var(--eje); border-radius: 0 4px 4px 0; }

/* ------------------------------------------------------------- buscador --- */
.controles-buscar { display: flex; flex-wrap: wrap; gap: var(--u); margin-bottom: calc(var(--u)*2); }
.controles-buscar input, .controles-buscar select { font: inherit; font-size: var(--f0);
  background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 6px 10px; }
.controles-buscar input[type="search"] { flex: 1 1 220px; }
.controles-buscar input[type="number"] { width: 110px; }
.controles-buscar label.marcar { display: inline-flex; align-items: center; gap: 6px; font-size: var(--f0); color: var(--tinta2); }

/* -------------------------------------------------------------- bandeja --- */
.bandeja-resumen { display: flex; flex-wrap: wrap; gap: calc(var(--u)*3); align-items: baseline; margin-bottom: calc(var(--u)*2); }
.bandeja-resumen .cuenta-pendientes { font-size: var(--f2); font-weight: 650; color: var(--amort); }
.pastilla { display: inline-block; font-size: var(--f0); border: 1px solid var(--linea);
  border-radius: 999px; padding: 1px 10px; color: var(--tinta2); }

/* ---------------------------------------------------------------- modal --- */
dialog#puerta { border: 0; border-radius: 10px; background: var(--superficie); color: var(--tinta);
  width: min(880px, calc(100vw - 32px)); max-height: min(82vh, 900px);
  padding: 0; margin: auto; }
dialog#puerta::backdrop { background: rgba(0,0,0,.45); }
#puerta .cuerpo { padding: calc(var(--u)*3); overflow: auto; max-height: min(82vh, 900px); }
#puerta header { display: flex; align-items: baseline; gap: calc(var(--u)*2); margin-bottom: var(--u); }
#puerta header h3 { font-size: var(--f2); font-weight: 650; }
#puerta header .sub { color: var(--tinta3); font-size: var(--f0); }
#puerta header button.cerrar { margin-left: auto; font-size: 20px; color: var(--tinta3); padding: 2px 8px; border-radius: 4px; }
#puerta header button.cerrar:hover { color: var(--tinta); background: var(--wash1); }
#puerta input[type="search"] { width: 100%; font: inherit; font-size: var(--f0); margin: var(--u) 0;
  background: var(--fondo); color: var(--tinta); border: 1px solid var(--linea); border-radius: var(--radio); padding: 6px 10px; }
#puerta .pie-suma { display: flex; justify-content: space-between; font-size: var(--f0); color: var(--tinta3);
  margin-top: var(--u); }
#puerta .pie-suma strong { color: var(--tinta); font-variant-numeric: tabular-nums; }
.mostrar-mas { display: block; width: 100%; text-align: center; font-size: var(--f0); color: var(--acento);
  padding: var(--u); margin-top: var(--u); border: 1px dashed var(--linea); border-radius: var(--radio); }

/* ------------------------------------------------------------------ pie --- */
footer.transparencia { max-width: 1080px; margin: calc(var(--u)*8) auto 0; font-size: var(--f0);
  color: var(--tinta3); border-top: 1px solid var(--rejilla); padding-top: calc(var(--u)*2); }
.asterisco { color: var(--amort); font-weight: 600; cursor: help; }

/* ------------------------------------------------------------ responsive --- */
@media (max-width: 900px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: calc(var(--u)*3) calc(var(--u)*2); }
  .dos-columnas, .tres-columnas { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  body { padding: calc(var(--u)*2) calc(var(--u)*1.5) calc(var(--u)*6); }
  .kpi .valor { font-size: 1.6rem; }
  .fila-barra { grid-template-columns: minmax(90px, 12ch) 1fr auto; }
  .fila-barra .delta { display: none; }
  table.datos .ocultable { display: none; }
  nav.periodo .resumen { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

#cerradura { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: var(--fondo); padding: calc(var(--u)*3); }
#cerradura .caja-clave { width: min(380px, 100%); text-align: left; }
#cerradura .marca { display: flex; align-items: center; gap: calc(var(--u)*1.5); margin-bottom: calc(var(--u)*4); }
#cerradura .marca svg { flex: none; }
#cerradura h1 { font-size: var(--f2); font-weight: 650; letter-spacing: -.01em; }
#cerradura p.pista { font-size: var(--f0); color: var(--tinta3); margin-bottom: calc(var(--u)*3); max-width: 40ch; }
#cerradura label { display: block; font-size: var(--f0); color: var(--tinta2); margin-bottom: 6px; }
#cerradura input[type="password"] { width: 100%; font: inherit; font-size: 1rem;
  background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 12px 14px; }
#cerradura input[type="password"]:focus-visible { border-color: var(--acento); }
#cerradura button.abrir { width: 100%; margin-top: calc(var(--u)*2); background: var(--acento); color: #fff;
  font-weight: 600; border-radius: var(--radio); padding: 13px; font-size: var(--f1); }
#cerradura button.abrir[disabled] { opacity: .55; }
#cerradura .recordar { display: flex; align-items: flex-start; gap: 8px; margin-top: calc(var(--u)*2);
  font-size: var(--f0); color: var(--tinta2); }
#cerradura .recordar input { margin-top: 3px; }
#cerradura .error { font-size: var(--f0); color: var(--mal); margin-top: var(--u); min-height: 1.4em; }
#cerradura .nota-pie { font-size: var(--f0); color: var(--tinta3); margin-top: calc(var(--u)*5); max-width: 42ch; }
body.bloqueado { overflow: hidden; }
body.bloqueado > *:not(#cerradura) { display: none; }
</style>

/* ==================== CERRADURA ====================
   Los datos llegan cifrados. Aquí se deriva la clave con PBKDF2 y se
   descifra con AES-GCM en el propio teléfono: la contraseña no viaja a
   ningún sitio, no hay servidor que la valide, no se envía nada a la red. */
(function () {
  'use strict';
  var C = window.__CIFRADO;
  var $ = function (s) { return document.querySelector(s); };
  var b64 = function (t) {
    var bin = atob(t), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  };
  var CLAVE_GUARDADA = 'panel.claveDispositivo';

  function pinta(msg) { $('#cerradura .error').textContent = msg || ''; }

  async function derivar(pass) {
    var material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(C.sal), iterations: C.iter, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function abrirCon(clave) {
    var plano = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(C.iv) }, clave, b64(C.datos));
    /* el JSON viaja comprimido: pesa la cuarta parte en el móvil */
    var texto;
    if (typeof DecompressionStream === 'function') {
      var flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
      texto = await new Response(flujo).text();
    } else {
      throw new Error('navegador-antiguo');
    }
    var sobre = JSON.parse(texto);
    window.__D = sobre.d;
    /* el código venía dentro del sobre cifrado y AES-GCM garantiza que es
       el nuestro sin tocar: si alguien lo alterase, no habríamos llegado
       hasta aquí porque el descifrado fallaría */
    (new Function(sobre.js))();
    document.body.classList.remove('bloqueado');
    var c = $('#cerradura');
    if (c) c.remove();
    window.__arrancarPanel();
  }

  async function intentar(pass, recordar) {
    var boton = $('#cerradura button.abrir');
    boton.disabled = true;
    boton.textContent = 'Abriendo…';
    pinta('');
    try {
      var clave = await derivar(pass);
      await abrirCon(clave);
      if (recordar) {
        var bruta = await crypto.subtle.exportKey('raw', clave);
        var arr = Array.from(new Uint8Array(bruta));
        try { localStorage.setItem(CLAVE_GUARDADA, JSON.stringify(arr)); } catch (e) {}
      } else {
        try { localStorage.removeItem(CLAVE_GUARDADA); } catch (e) {}
      }
    } catch (err) {
      boton.disabled = false;
      boton.textContent = 'Abrir el panel';
      if (err && err.message === 'navegador-antiguo')
        pinta('Este navegador es demasiado antiguo para abrir el panel. Prueba con otro.');
      else pinta('Contraseña incorrecta.');
      var inp = $('#cerradura input[type="password"]');
      inp.select();
    }
  }

  /* si el dispositivo ya está recordado, se abre sin preguntar */
  async function intentarGuardada() {
    var guardada = null;
    try { guardada = localStorage.getItem(CLAVE_GUARDADA); } catch (e) {}
    if (!guardada) return false;
    try {
      var arr = new Uint8Array(JSON.parse(guardada));
      var clave = await crypto.subtle.importKey('raw', arr, 'AES-GCM', true, ['decrypt']);
      await abrirCon(clave);
      return true;
    } catch (e) {
      try { localStorage.removeItem(CLAVE_GUARDADA); } catch (e2) {}
      return false;
    }
  }

  window.addEventListener('DOMContentLoaded', async function () {
    if (await intentarGuardada()) return;
    var form = $('#cerradura form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = $('#cerradura input[type="password"]').value;
      if (pass) intentar(pass, $('#cerradura .recordar input').checked);
    });
    $('#cerradura input[type="password"]').focus();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
