/* ═══════════════════════════════════════════════════════════════════════════
   FINANZAS J&A · rediseño 21/08/2026
   Idea rectora: un cuaderno de familia, no un terminal. Papel cálido, los
   datos en tarjetas serenas, y cada capítulo abre con LA PREGUNTA que
   responde, en serifa — la narrativa manda, las cifras (siempre en sans)
   responden. El color sigue significando lo de siempre: verde entra, rojo
   sale, azul inversión, ámbar deuda que se hace propiedad, gris opinión.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: light;
  /* papel e tinta (modo claro) */
  --fondo: #f4f2ec; --superficie: #fdfcf9;
  --tinta: #1b1a17; --tinta2: #4c4a44; --tinta3: #67655c;
  --rejilla: #e6e3da; --eje: #c4c1b4; --linea: rgba(27,26,23,.13);
  /* COLOR CON SIGNIFICADO — asignación fija en todo el panel, validada con
     scripts/validate_palette.js de la skill dataviz en los dos modos */
  --ingreso: #008300;       /* verde  · ingresos                             */
  --gasto:   #e34948;       /* rojo   · gasto y deudas                       */
  --inver:   #2a78d6;       /* azul   · inversión y dinero nuevo             */
  --amort:   #c98500;       /* ámbar  · amortización de deuda                */
  --valora:  #7a776f;       /* gris   · cambio de valoración (no es dinero)  */
  /* El acento es de la INTERFAZ, nunca de los datos: foco, selección, pestaña
     activa, hover. Era el mismo azul que «inversión» y un hover podía leerse
     como un dato; desde el 26/08/2026 es el ocre de la marca. No se usa el
     #c98500 exacto porque sobre papel claro da 2,99 de contraste (ilegible):
     este es un paso más profundo, misma familia. */
  --acento:  #9c6600;       /* ocre   · interfaz: foco, selección, enlaces   */
  --acento-tinta: #ffffff;  /* lo que se escribe ENCIMA del acento relleno   */
  --patri-total: #6da7ec;   /* azul claro · patrimonio total (contexto)      */
  --medio-ingreso: rgba(0,131,0,.5);
  --bien: #006300; --mal: #c53030;
  /* el wash del hover: a .10 el ocre separa 30,8 sobre la superficie, algo
     más que los 24,9 que daba el azul, así que no hace falta subir el alfa */
  --wash1: rgba(156,102,0,.10); --wash2: rgba(237,161,0,.14); --wash3: rgba(0,131,0,.10);
  /* tipografía: sans del sistema para TODO dato; la serifa es solo la voz
     editorial (las preguntas de capítulo) y nunca lleva cifras */
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: Charter, Georgia, Cambria, "Times New Roman", serif;
  --f0: .8125rem; --f1: .9375rem; --f2: 1.25rem; --f3: clamp(2rem, 3.4vw, 2.6rem);
  --u: 8px;
  --radio: 8px;             /* controles */
  --tarjeta: 14px;          /* tarjetas */
  --alto-fijo: 152px;       /* alto de la barra pegada: los saltos aterrizan debajo */
}
:root[data-tema="oscuro"] { color-scheme: dark;
  --fondo: #131311; --superficie: #1d1c19;
  --tinta: #f2f1ec; --tinta2: #c8c6bc; --tinta3: #a3a199;
  --rejilla: #2a2925; --eje: #3d3c36; --linea: rgba(255,255,255,.13);
  --ingreso: #008300; --gasto: #e66767; --inver: #3987e5;
  --amort: #c98500; --valora: #c3c2b7; --acento: #3987e5; --patri-total: #1c5cab;
  --medio-ingreso: rgba(0,131,0,.5);
  --bien: #35b535; --mal: #ef7070;
  --wash1: rgba(57,135,229,.16); --wash2: rgba(201,133,0,.18); --wash3: rgba(0,131,0,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) { color-scheme: dark;
    --fondo: #131311; --superficie: #1d1c19;
    --tinta: #f2f1ec; --tinta2: #c8c6bc; --tinta3: #a3a199;
    --rejilla: #2a2925; --eje: #3d3c36; --linea: rgba(255,255,255,.13);
    --ingreso: #008300; --gasto: #e66767; --inver: #3987e5;
    --amort: #c98500; --valora: #c3c2b7; --acento: #dda01a; --acento-tinta: #1b1a17;
    --patri-total: #1c5cab;
    --medio-ingreso: rgba(0,131,0,.5);
    --bien: #35b535; --mal: #ef7070;
    --wash1: rgba(221,160,26,.16); --wash2: rgba(201,133,0,.18); --wash3: rgba(0,131,0,.18);
  }
}

/* ------------------------------------------------------------------ base --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  background: var(--fondo); color: var(--tinta);
  font: 400 var(--f1)/1.5 var(--sans);
  padding: calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*10);
  -webkit-tap-highlight-color: transparent;
  scrollbar-color: var(--eje) transparent;
}
main { max-width: 1080px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 2px; }
/* Enlace de salto: invisible hasta que alguien llega con el tabulador. Sin él,
   ir al panel con teclado costaba pasar por el tema, las vistas, el periodo y
   los doce capítulos. No se usa `display:none` porque eso lo sacaría del orden
   de tabulación y entonces no serviría de nada. */
a.saltar { position: fixed; top: 0; left: 50%; transform: translate(-50%, -110%);
  z-index: 200; background: var(--acento); color: var(--acento-tinta);
  padding: 10px 18px; border-radius: 0 0 8px 8px; font-size: var(--f0);
  font-weight: 600; text-decoration: none; transition: transform .14s ease; }
a.saltar:focus, a.saltar:focus-visible { transform: translate(-50%, 0); }
main:focus { outline: none; }
::selection { background: var(--wash1); }
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a { transition: background .12s ease, color .12s ease, border-color .12s ease; }

/* ---------------------------------------------------------- encabezado --- */
header.principal { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u)*1.75);
  max-width: 1080px; margin: 0 auto calc(var(--u)*2.5); }
.marca-panel { flex: none; display: block; }
.marca-panel svg { display: block; border-radius: 8px; outline: 1px solid var(--linea); }
header.principal h1 { font-size: 1.375rem; font-weight: 750; letter-spacing: -.015em; }
header.principal .fecha { color: var(--tinta3); font-size: var(--f0); }
header.principal .relleno { flex: 1; }

.selector-tema { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px;
  padding: 2px; background: var(--superficie); }
.selector-tema button { font-size: var(--f0); color: var(--tinta3); padding: 3px 11px; border-radius: 999px; }
.selector-tema button:hover { color: var(--tinta); }
.selector-tema button[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); }

/* ------------------------------------------------------- barra superior --- */
/* Las tres filas de control viajan juntas, pegadas arriba: QUIÉN mira
   (vistas), DE CUÁNDO son las cifras (periodo) y DÓNDE estás (capítulos). */
.barra-superior { position: sticky; top: 0; z-index: 40;
  background: var(--fondo);
  background: color-mix(in srgb, var(--fondo) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  max-width: 1080px; margin: 0 auto calc(var(--u)*5);
  border-bottom: 1px solid var(--linea); }
.barra-superior.sin-periodo { border-bottom: 1px solid var(--linea); }

nav.vistas { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--u);
  border-bottom: 1px solid var(--rejilla); }
nav.vistas .pestanas { display: flex; gap: 2px; }
nav.vistas button { position: relative; font-size: var(--f1); font-weight: 600; color: var(--tinta3);
  padding: calc(var(--u)*1.25) calc(var(--u)*2); border-radius: var(--radio) var(--radio) 0 0; }
nav.vistas button:hover { color: var(--tinta); background: var(--wash1); }
nav.vistas button[aria-pressed="true"] { color: var(--tinta); }
nav.vistas button[aria-pressed="true"]::after { content: ''; position: absolute;
  left: calc(var(--u)*1.25); right: calc(var(--u)*1.25); bottom: -1px; height: 2px;
  background: var(--acento); border-radius: 2px 2px 0 0; }
nav.vistas .pista-vista { flex: 1 1 24ch; min-width: 0; text-align: right;
  font-size: var(--f0); color: var(--tinta3); line-height: 1.35; align-self: center; }

nav.periodo { max-width: 1080px; margin: 0 auto;
  padding: calc(var(--u)*1.25) 0 calc(var(--u)*1); display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }
nav.periodo[hidden] { display: none; }
nav.periodo .grupo { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 2px; background: var(--superficie); }
nav.periodo button.opcion { font-size: var(--f0); padding: 3px 10px; border-radius: 6px; color: var(--tinta2); white-space: nowrap; }
nav.periodo button.opcion:hover { background: var(--wash1); }
nav.periodo button.opcion[aria-pressed="true"] { background: var(--acento); color: var(--acento-tinta); }
nav.periodo select, nav.periodo input[type="date"] {
  font: inherit; font-size: var(--f0); color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 6px; padding: 3px 6px; }
nav.periodo .rango-fechas { display: none; gap: var(--u); align-items: center; font-size: var(--f0); color: var(--tinta3); }
nav.periodo .rango-fechas.visible { display: inline-flex; }
nav.periodo .resumen { margin-left: auto; font-size: var(--f0); color: var(--tinta3); }

/* capítulos: dónde estás y a dónde saltar; el actual va en tinta plena.
   Monocromo a propósito: el color con significado se reserva a los datos. */
/* Doce chips miden ~1.213 px y la barra esta topada en 1.080: se veian 10 y
   medio en cualquier monitor, con el scrollbar oculto y sin manera de llegar
   al 12. Envolviendo, los doce estan a un clic. En el telefono envolver comeria
   media pantalla: alli sigue la tira deslizante. */
nav.capitulos { display: flex; flex-wrap: wrap; gap: 6px;
  padding: calc(var(--u)*0.5) 0 calc(var(--u)*1.25); scrollbar-width: none; }
@media (max-width: 900px) { nav.capitulos { flex-wrap: nowrap; overflow-x: auto; } }
nav.capitulos::-webkit-scrollbar { display: none; }
nav.capitulos button { display: inline-flex; align-items: baseline; gap: 6px; font-size: var(--f0);
  padding: 3px 12px; border: 1px solid var(--linea); border-radius: 999px;
  color: var(--tinta2); white-space: nowrap; background: var(--superficie); }
nav.capitulos button .n { font-size: .6875rem; color: var(--tinta3); font-variant-numeric: tabular-nums; }
nav.capitulos button:hover { border-color: var(--acento); color: var(--tinta); }
nav.capitulos button[aria-current="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--fondo); }
nav.capitulos button[aria-current="true"] .n { color: var(--fondo); opacity: .65; }

/* -------------------------------------------------------------- avisos --- */
.avisos { margin: 0 0 calc(var(--u)*4); display: grid; gap: var(--u); }
.avisos p { font-size: var(--f0); color: var(--tinta2); padding: var(--u) calc(var(--u)*1.5);
  border-left: 3px solid var(--amort); background: var(--wash2); border-radius: 0 var(--radio) var(--radio) 0; }

/* ------------------------------------------------------------ secciones --- */
main { counter-reset: seccion; }
section { margin: 0 0 calc(var(--u)*11); scroll-margin-top: var(--alto-fijo); }
/* una seccion sin nada que decir (los avisos, casi siempre) no deja un hueco */
section:has(> .contenido:empty) { margin-bottom: 0; }
section > h2 { font-size: var(--f0); font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
  color: var(--tinta3); margin-bottom: calc(var(--u)*0.75); }
section > h2::before { counter-increment: seccion; content: counter(seccion, decimal-leading-zero);
  font-weight: 400; letter-spacing: .04em; margin-right: calc(var(--u)*1.5); opacity: .6;
  font-variant-numeric: tabular-nums; }
/* la pregunta que responde el capítulo, en serifa: es la voz editorial del
   panel y NUNCA lleva cifras — los números son siempre de la sans */
section > .pregunta { font-family: var(--serif); font-size: clamp(1.35rem, 2.3vw, 1.6rem);
  font-weight: 600; line-height: 1.25; letter-spacing: -.005em; color: var(--tinta);
  margin: 0 0 calc(var(--u)*3); }
.explica { font-size: var(--f0); color: var(--tinta3); max-width: 62ch; margin-bottom: calc(var(--u)*2); }

/* ---------------------------------------------------------- diagnóstico --- */
.diagnostico { font-size: 1.3125rem; line-height: 1.6; max-width: 72ch; color: var(--tinta2);
  letter-spacing: -.005em; margin: calc(var(--u)*1) 0 calc(var(--u)*2); }
.diagnostico strong { color: var(--tinta); font-weight: 650; white-space: nowrap; }
.diagnostico .mal { color: var(--mal); } .diagnostico .bien { color: var(--bien); }
button.enlace-puerta { display: inline; font: inherit; color: inherit; padding: 0;
  border-bottom: 1px dashed var(--eje); border-radius: 0; }
button.enlace-puerta:hover, button.enlace-puerta:focus-visible { color: var(--acento); border-bottom-color: var(--acento); }

/* ------------------------------------------------------------- tarjetas --- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*2); }
/* Salud lleva cinco tarjetas. Los tres cortes van aqui porque
   .kpis.kpis-salud gana en especificidad a la media query general de mas
   abajo, que si no nunca llegaria a aplicarse. */
/* Cinco tarjetas no caben en una rejilla de 4, 3 o 2 columnas sin dejar la
   ultima fila coja (2+2+1, 3+2) — y eso es justo lo que se veia mal. Como
   tira de columnas automaticas todas miden SIEMPRE lo mismo: se reparten el
   ancho cuando caben y, cuando no, mantienen su medida y la tira se desplaza
   de lado. Nunca hay hueco ni tarjeta de otro tamano. */
.kpis.kpis-salud { grid-template-columns: none; grid-auto-flow: column;
  grid-auto-columns: minmax(196px, 1fr); overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity; scrollbar-width: thin; padding-bottom: 2px; }
.kpis.kpis-salud > .kpi { scroll-snap-align: start; }
.kpi { text-align: left; background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--tarjeta); padding: calc(var(--u)*2) calc(var(--u)*2.25);
}
/* Un <button> centra su contenido en vertical cuando la rejilla lo estira, y
   Chromium ignora align-items en botones normales: la tarjeta con menos texto
   flotaba y los numeros grandes de una misma fila quedaban a alturas
   distintas. Convertida en rejilla de una columna anclada arriba, cada pieza
   es una fila y los numeros comparten altura. Solo en las tarjetas de KPIs:
   las de Deuda llevan pares en linea (importe + "pendientes al X %") que una
   rejilla partiria. */
.kpis > .kpi, .tres-columnas > .kpi { display: grid; align-content: start; justify-items: start; }
button.kpi:hover { border-color: var(--acento); }
button.kpi:hover .valor { color: var(--acento); }
.kpi .etiqueta { font-size: var(--f0); color: var(--tinta3); display: block; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* La tarjeta del gasto del mes se llena como un vaso: una capa lisa sube
   desde abajo con el color del objetivo (verde mientras no se pase, rojo en
   cuanto se pase) y el texto se queda encima, en su color normal, siempre
   legible caiga donde caiga la línea del líquido.
   #kpi-gastomes gana su propio contexto de apilamiento (position+z-index:0)
   SOLO ella, sin tocar `.kpi` en general: la capa de relleno lleva
   z-index:-1 y así pinta detrás del texto sin tener que retocar el resto de
   spans de la tarjeta. overflow:hidden recorta el relleno a las esquinas. */
#kpi-gastomes { position: relative; z-index: 0; overflow: hidden; }
#kpi-gastomes .relleno-caja {
  position: absolute; z-index: -1; left: 0; right: 0; bottom: 0;
  background: color-mix(in oklab, var(--tono) 30%, var(--superficie));
  border-top: 2px solid var(--tono);
  transition: height .4s ease;
}
.kpi .valor .unidad { display: block; font-size: var(--f1); font-weight: 400; letter-spacing: 0;
  color: var(--tinta3); line-height: 1.15; margin-top: 1px; }
.kpi .valor { display: block; font-size: var(--f3); font-weight: 700; letter-spacing: -.02em; line-height: 1.12;
  font-variant-numeric: normal; }
.kpi .detalle { display: block; }
.kpi .detalle { font-size: var(--f0); color: var(--tinta2); margin-top: 3px; }
.kpi .desglose { display: block; margin-top: 6px; }
.kpi .desglose .parte { display: flex; justify-content: space-between; max-width: 15ch;
  font-size: var(--f0); font-variant-numeric: tabular-nums; color: var(--tinta2); line-height: 1.5; }
.kpi .desglose .banco { color: var(--tinta3); margin-right: calc(var(--u)*1.5); }
.kpi .delta { font-size: var(--f0); font-weight: 600; }
.delta.bien { color: var(--bien); } .delta.mal { color: var(--mal); } .delta.neutro { color: var(--tinta3); }

/* ----------------------------------------------------------- sparklines --- */
.kpi .chispa { display: block; margin-top: calc(var(--u)*1); height: 26px; }
.kpi .chispa svg { display: block; }
.medidor { display: block; margin-top: calc(var(--u)*1.25); width: 116px; height: 6px;
  border-radius: 3px; background: var(--rejilla); position: relative; overflow: hidden; }
.medidor .relleno-medidor { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }

/* ---------------------------------------------------------------- pulso --- */
.pulso-fila { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u)*4);
  align-items: center; margin-top: calc(var(--u)*2.5);
  background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--tarjeta);
  padding: calc(var(--u)*2.5) calc(var(--u)*3); }
button.pulso { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0; }
button.pulso:hover .pulso-nota strong { color: var(--acento); }
.pulso-nota { font-size: var(--f2); font-weight: 650; font-variant-numeric: tabular-nums; }
.pulso-nota .sec { font-size: var(--f0); font-weight: 400; color: var(--tinta3); }
.pulso-tramos .fila-barra.tramo { grid-template-columns: minmax(96px, 13ch) 1fr 3ch minmax(0, 22ch); }
.pulso-tramos .fila-barra.tramo .delta { text-align: left; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 700px) {
  .pulso-fila { grid-template-columns: 1fr; gap: calc(var(--u)*2); justify-items: center; }
  .pulso-tramos { width: 100%; }
  .pulso-tramos .fila-barra.tramo { grid-template-columns: minmax(90px, 12ch) 1fr 3ch; }
  .pulso-tramos .fila-barra.tramo .delta { display: none; }
}

/* -------------------------------------------------------------- objetivo --- */
.objetivo { margin-top: calc(var(--u)*2.5); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: var(--tarjeta);
  padding: calc(var(--u)*2.5) calc(var(--u)*3); }
.objetivo-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--u); justify-content: space-between; }
.objetivo-titulo { font-size: var(--f0); font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta3); }
.objetivo-cifra { font-size: var(--f2); font-weight: 650; font-variant-numeric: tabular-nums; }
.objetivo-cifra .sec { font-size: var(--f1); font-weight: 400; color: var(--tinta3); }
.objetivo-pista { position: relative; height: 8px; border-radius: 4px; background: var(--rejilla);
  margin: calc(var(--u)*1.5) 0 var(--u); overflow: hidden; }
.objetivo-relleno { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--acento); min-width: 3px; }
.objetivo-relleno.corto { background: var(--mal); }
.objetivo-pie { font-size: var(--f0); color: var(--tinta2); max-width: 76ch; }
.objetivo-pie strong { color: var(--tinta); }

/* ------------------------------------------------------------ simulador --- */
.simulador { margin-top: calc(var(--u)*5); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: var(--tarjeta);
  padding: calc(var(--u)*2.5) calc(var(--u)*3); }
.simulador-cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--u); justify-content: space-between; margin-bottom: calc(var(--u)*2); }
.simulador-cab h3 { font-size: var(--f0); font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta3); }
.simulador-control { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u)*2); margin-bottom: calc(var(--u)*3); }
.simulador-control label { font-size: var(--f0); color: var(--tinta2); }
.simulador-control input[type="range"] { flex: 1 1 220px; min-width: 160px; accent-color: var(--acento);
  height: 22px; background: transparent; }
.simulador-control .renta-actual { font-size: var(--f3); font-weight: 700; letter-spacing: -.02em;
  font-variant-numeric: normal; min-width: 5ch; }
.simulador-control .renta-actual .unidad { font-size: var(--f1); font-weight: 400; color: var(--tinta3); }
.simulador-control button.reset { font-size: var(--f0); color: var(--tinta3); text-decoration: underline dotted; }
.simulador-control button.reset:hover { color: var(--acento); }
.simulador-salidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*3); }
.simulador-salidas .caja .etiqueta { font-size: var(--f0); color: var(--tinta3); display: block; }
.simulador-salidas .caja .cifra { font-size: var(--f2); font-weight: 650; font-variant-numeric: tabular-nums; }
.simulador-salidas .caja .delta { font-size: var(--f0); display: block; }
.bandas { margin-top: calc(var(--u)*3); }
.bandas-pista { position: relative; height: 6px; border-radius: 3px; background: var(--rejilla); margin: calc(var(--u)*3) 0 var(--u); }
.bandas-zona { position: absolute; top: 0; bottom: 0; background: var(--wash1); }
.bandas-marca { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--tinta3); }
.bandas-aguja { position: absolute; top: -7px; bottom: -7px; width: 3px; background: var(--acento); border-radius: 2px; }
.bandas-aguja::after { content: attr(data-txt); position: absolute; left: 50%; transform: translateX(-50%);
  top: -20px; font-size: var(--f0); font-weight: 600; color: var(--acento); white-space: nowrap; }
.bandas-eje { display: flex; justify-content: space-between; font-size: var(--f0); color: var(--tinta3); }
@media (max-width: 480px) { .simulador-salidas { grid-template-columns: 1fr; gap: var(--u); } }

/* --------------------------------------------------- ayudas con puntitos --- */
[data-ayuda] { text-decoration: underline dotted var(--tinta3); text-underline-offset: 3px; cursor: help; }
#globo { position: fixed; z-index: 90; max-width: 300px; background: var(--tinta); color: var(--fondo);
  font-size: var(--f0); line-height: 1.45; padding: calc(var(--u)*1.25) calc(var(--u)*1.5);
  border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .12s; }
#globo.visible { opacity: 1; }
#globo strong { display: block; margin-bottom: 2px; }

/* ------------------------------------------------------------- gráficos --- */
.grafico { position: relative; }
.grafico svg text { font: 400 11px var(--sans);
  fill: var(--tinta3); font-variant-numeric: tabular-nums; }
.grafico svg .titulo-serie { font-weight: 600; fill: var(--tinta2); }
.cabecera-grafico { display: flex; align-items: baseline; flex-wrap: wrap; gap: calc(var(--u)*2); margin-bottom: var(--u); }
.leyenda { display: flex; flex-wrap: wrap; gap: calc(var(--u)*2); font-size: var(--f0); color: var(--tinta2); }
.leyenda .clave { display: inline-flex; align-items: center; gap: 6px; }
.leyenda .muestra { width: 12px; height: 12px; border-radius: 3px; }
.leyenda .muestra.linea { height: 3px; border-radius: 2px; }
.conmutador { display: inline-flex; gap: 2px; border: 1px solid var(--linea); border-radius: var(--radio);
  padding: 2px; background: var(--superficie); }
.conmutador button { font-size: var(--f0); padding: 3px 10px; border-radius: 6px; color: var(--tinta2); white-space: nowrap; }
.conmutador button:hover { background: var(--wash1); }
.conmutador button[aria-pressed="true"] { background: var(--acento); color: var(--acento-tinta); }
.ver-tabla { font-size: var(--f0); color: var(--tinta3); text-decoration: underline dotted; margin-left: auto; }
.ver-tabla:hover { color: var(--acento); }
#tooltip-marca { position: fixed; z-index: 80; pointer-events: none; background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 10px; padding: var(--u) calc(var(--u)*1.5);
  font-size: var(--f0); opacity: 0; transition: opacity .1s; box-shadow: none; min-width: 150px; }
#tooltip-marca.visible { opacity: 1; }
#tooltip-marca .titulo { color: var(--tinta3); margin-bottom: 4px; }
#tooltip-marca .fila { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#tooltip-marca .fila .nombre { color: var(--tinta2); display: inline-flex; align-items: center; gap: 6px; }
#tooltip-marca .fila .clave-linea { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
#tooltip-marca .fila .cifra { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--tinta); }
.marca-interactiva { cursor: pointer; }
.marca-interactiva:hover { filter: brightness(1.12); }

/* --------------------------------------------------------------- tablas --- */
table.datos { width: 100%; border-collapse: collapse; font-size: var(--f0); }
table.datos th { text-align: left; font-size: .6875rem; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--tinta3); padding: 6px 10px 6px 0;
  border-bottom: 1px solid var(--eje); white-space: nowrap; cursor: pointer; user-select: none; }
table.datos th.num, table.datos td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.datos td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rejilla); vertical-align: baseline; }
table.datos tr.clicable { cursor: pointer; }
table.datos tr.clicable:hover td { background: var(--wash1); }
table.datos tfoot td { font-weight: 650; border-bottom: 0; border-top: 1px solid var(--eje); }
table.datos tr.total td { font-weight: 650; border-top: 1px solid var(--eje); }
.hab-tabla input, .hab-tabla select { font: inherit; font-size: var(--f0); color: var(--tinta);
  background: var(--superficie); border: 1px solid var(--linea); border-radius: 6px; padding: 3px 6px; }
.hab-tabla input { width: 5em; text-align: right; }
.hab-tabla td { white-space: nowrap; }
table.datos .sec { color: var(--tinta3); }
/* La muestra de color va en la CABECERA y no en los números a propósito: los
   colores de relleno del gráfico no valen para texto pequeño (el ámbar da
   2,99:1 sobre claro). El color de cifra se reserva a la columna-veredicto,
   con --bien/--mal, que sí están calculados para texto. */
table.datos th .muestra-col { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
  margin-right: 5px; box-shadow: inset 0 0 0 1px var(--linea); }
table.datos th .muestra-col.tenue { opacity: .5; }
table.datos .bien { color: var(--bien); }
table.datos .mal { color: var(--mal); }
.neg { color: var(--tinta); } .num .signo-neg { }
table.datos mark { background: var(--wash2); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ------------------------------------------------------- filas con barra --- */
.filas-barra { display: grid; gap: 6px; }
.fila-barra { display: grid; grid-template-columns: minmax(110px, 15ch) 1fr auto auto; gap: calc(var(--u)*1.5);
  align-items: center; padding: 2px 0; border-radius: 4px; text-align: left; font-size: var(--f0); }
button.fila-barra:hover { background: var(--wash1); }
.fila-barra .nombre { color: var(--tinta2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-barra .pista { position: relative; height: 14px; }
/* Las barras de «Gasto por categoría» heredaban el acento: el gasto salía
   pintado del color de la inversión. Son gasto, y el gasto es rojo en todo
   el panel. Quien necesite otro color lo pone en su style, como ya hacen
   Patrimonio y el alquiler. */
.fila-barra .relleno { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--gasto); min-width: 2px; }
.fila-barra .marca-previa { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta3); }
.fila-barra .importe { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.fila-barra .delta { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 7ch; text-align: right; }
.subtotal { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--f0);
  color: var(--tinta3); margin: calc(var(--u)*2) 0 var(--u); border-bottom: 1px solid var(--rejilla); padding-bottom: 4px; }
.subtotal strong { color: var(--tinta2); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ dos columnas - */
.dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*4); align-items: start; }
.tres-columnas { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*2); align-items: start; }

/* ---------------------------------------------------------------- deuda --- */
.hipoteca h3 { font-size: var(--f1); font-weight: 650; margin-bottom: 2px; }
.hipoteca .grande { font-size: var(--f2); font-weight: 700; letter-spacing: -.01em; }
.hipoteca dl { display: grid; grid-template-columns: auto auto; gap: 2px calc(var(--u)*2);
  font-size: var(--f0); margin-top: var(--u); }
.hipoteca dt { color: var(--tinta3); } .hipoteca dd { text-align: right; font-variant-numeric: tabular-nums; }
.barra-cuota { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: var(--u) 0 4px; gap: 2px; }
.barra-cuota .amort { background: var(--amort); border-radius: 4px 0 0 4px; }
.barra-cuota .inter { background: var(--eje); border-radius: 0 4px 4px 0; }
/* lo que aún no se ha devuelto: pista vacía, no un color con significado */
.barra-cuota .resto { background: var(--rejilla); border-radius: 0 4px 4px 0; }
/* barra general de la sección: mismo idioma que la del colchón, en ámbar */
.barra-total { position: relative; height: 10px; border-radius: 5px; background: var(--rejilla);
  overflow: hidden; margin: var(--u) 0 6px; }
.barra-total .hecho { position: absolute; inset: 0 auto 0 0; background: var(--amort);
  border-radius: 5px; min-width: 3px; }
.barra-total + .pie-barra { margin-bottom: calc(var(--u)*2); }
button.subtotal.resumen-deuda { width: 100%; text-align: left; }
button.subtotal.resumen-deuda:hover strong,
button.subtotal.resumen-deuda:focus-visible strong { color: var(--acento); }
/* dos barras que se parecen no pueden querer decir cosas distintas en
   silencio: cada una lleva debajo su leyenda con muestra y cifra */
.pie-barra { display: flex; flex-wrap: wrap; gap: 2px calc(var(--u)*1.5); font-size: var(--f0);
  color: var(--tinta3); margin: 0 0 calc(var(--u)*0.5); }
.pie-barra .clave { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pie-barra .clave i { width: 9px; height: 9px; border-radius: 2px; flex: none;
  box-shadow: inset 0 0 0 1px var(--linea); }

/* ------------------------------------------------------------- buscador --- */
.controles-buscar { display: flex; flex-wrap: wrap; gap: var(--u); margin-bottom: calc(var(--u)*2); }
.controles-buscar input, .controles-buscar select { font: inherit; font-size: var(--f0);
  background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 7px 10px; }
.controles-buscar input[type="search"] { flex: 1 1 220px; }
.controles-buscar input[type="number"] { width: 110px; }
.controles-buscar label.marcar { display: inline-flex; align-items: center; gap: 6px; font-size: var(--f0); color: var(--tinta2); }
.controles-buscar .rango-buscar { display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--f0); color: var(--tinta3); }
.resumen-busqueda { display: flex; flex-wrap: wrap; gap: calc(var(--u)*2); align-items: baseline;
  font-size: var(--f0); color: var(--tinta3); margin: 0 0 var(--u);
  padding-bottom: 6px; border-bottom: 1px solid var(--rejilla); }
.resumen-busqueda strong { color: var(--tinta); font-variant-numeric: tabular-nums; }
.resumen-busqueda .bien { color: var(--bien); }
.resumen-busqueda .mal { color: var(--mal); }

/* -------------------------------------------------------------- bandeja --- */
.bandeja-resumen { display: flex; flex-wrap: wrap; gap: calc(var(--u)*3); align-items: baseline; margin-bottom: calc(var(--u)*2); }
.bandeja-resumen .cuenta-pendientes { font-size: var(--f2); font-weight: 650; color: var(--amort); }
.pastilla { display: inline-block; font-size: var(--f0); border: 1px solid var(--linea);
  border-radius: 999px; padding: 1px 10px; color: var(--tinta2); }

/* ---------------------------------------------------------------- modal --- */
dialog#puerta { border: 1px solid var(--linea); border-radius: 16px; background: var(--superficie); color: var(--tinta);
  width: min(880px, calc(100vw - 32px)); max-height: min(82vh, 900px);
  padding: 0; margin: auto; }
dialog#puerta::backdrop { background: rgba(15,14,12,.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
#puerta .cuerpo { padding: calc(var(--u)*3); overflow: auto; max-height: min(82vh, 900px); }
#puerta header { display: flex; align-items: baseline; gap: calc(var(--u)*2); margin-bottom: var(--u); }
#puerta header h3 { font-size: var(--f2); font-weight: 700; letter-spacing: -.01em; }
#puerta header .sub { color: var(--tinta3); font-size: var(--f0); }
#puerta header button.cerrar { margin-left: auto; font-size: 20px; color: var(--tinta3); padding: 2px 8px; border-radius: 6px; }
#puerta header button.cerrar:hover { color: var(--tinta); background: var(--wash1); }
#puerta input[type="search"] { width: 100%; font: inherit; font-size: var(--f0); margin: var(--u) 0;
  background: var(--fondo); color: var(--tinta); border: 1px solid var(--linea); border-radius: var(--radio); padding: 7px 10px; }
#puerta .pie-suma { display: flex; justify-content: space-between; font-size: var(--f0); color: var(--tinta3);
  margin-top: var(--u); }
#puerta .pie-suma strong { color: var(--tinta); font-variant-numeric: tabular-nums; }
.mostrar-mas { display: block; width: 100%; text-align: center; font-size: var(--f0); color: var(--acento);
  padding: var(--u); margin-top: var(--u); border: 1px dashed var(--linea); border-radius: var(--radio); }

/* ------------------------------------------------------------------ pie --- */
footer.transparencia { max-width: 1080px; margin: calc(var(--u)*8) auto 0; font-size: var(--f0);
  color: var(--tinta3); border-top: 1px solid var(--rejilla); padding-top: calc(var(--u)*2); }
.asterisco { color: var(--amort); font-weight: 600; cursor: help; }

/* ------------------------------------------------------ piso: cobros y capas --- */
.cobros { display: flex; flex-wrap: wrap; gap: 4px; margin: var(--u) 0 6px; }
.cobros .mes { width: 22px; height: 22px; border-radius: 5px; padding: 0;
  border: 1px solid var(--linea); background: transparent; }
.cobros .mes.vacio { background: var(--rejilla); border-color: transparent; opacity: .55; }
.cobros .mes.cobrado { background: var(--ingreso); border-color: var(--ingreso); }
.cobros .mes.parcial { background: var(--amort); border-color: var(--amort); }
.cobros .mes.fallo { background: var(--gasto); border-color: var(--gasto); }
.cobros .mes.encurso { outline: 2px dashed var(--eje); outline-offset: 1px; }
.cobros .mes:hover { border-color: var(--tinta); }
.cobros .salto { width: 8px; }
.tarjeta-alq { background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--tarjeta); padding: calc(var(--u)*2) calc(var(--u)*2.5); }
.tarjeta-alq .subtotal { border-bottom: 0; padding-bottom: 0; }
.capa-pila { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden;
  margin: 4px 0 calc(var(--u)*1.5); }
.recupera { margin-top: calc(var(--u)*3); }
.recupera-pila { display: flex; height: 14px; border-radius: 4px; overflow: hidden;
  background: var(--rejilla); margin: 6px 0; }
.recupera-pila span { display: block; height: 100%; }
.capa { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; font-size: var(--f1); padding: 7px 0; }
.capa i { width: 12px; height: 12px; border-radius: 3px; }
.capa .como { color: var(--tinta3); font-size: var(--f0); }
.capa .cuanto { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
button.capa:hover .cuanto { color: var(--acento); }
.capa.total { border-top: 1px solid var(--rejilla); }
.muestra-valora { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
  background: var(--valora); margin-right: 6px; }

/* ------------------------------------------------------ desglose: matrices --- */
.matriz-envoltura { overflow-x: auto; margin-top: var(--u); }
table.matriz { border-collapse: separate; border-spacing: 2px; font-size: var(--f0); }
table.matriz th { font-size: .6875rem; font-weight: 650; letter-spacing: .05em; text-transform: uppercase;
  color: var(--tinta3); padding: 3px 7px; text-align: right; white-space: nowrap; }
table.matriz th.fila { text-align: left; position: sticky; left: 0; background: var(--fondo);
  text-transform: none; letter-spacing: 0; font-size: var(--f0); color: var(--tinta2);
  max-width: 18ch; overflow: hidden; text-overflow: ellipsis; }
table.matriz td { padding: 4px 7px; text-align: right; font-variant-numeric: tabular-nums;
  border-radius: 4px; min-width: 52px; white-space: nowrap; }
table.matriz td.hueco { background: transparent; }
table.matriz td.celda { cursor: pointer; }
table.matriz td.celda:hover, table.matriz td.celda:focus-visible { outline: 2px solid var(--acento); outline-offset: -1px; }
table.matriz td.parcial { outline: 2px dashed var(--eje); outline-offset: -1px; }
table.matriz td.parcial:hover { outline-color: var(--acento); outline-style: solid; }
table.matriz td.total { font-weight: 650; background: transparent; }
table.matriz td.celda-pct { font-size: .75rem; }
table.matriz .bien { color: var(--bien); } table.matriz .mal { color: var(--mal); }
.sel-mes-cat { display: inline-flex; align-items: center; gap: 6px; font-size: var(--f0); color: var(--tinta3); }
.sel-mes-cat select { font: inherit; font-size: var(--f0); color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 6px; padding: 3px 6px; }
#sel-mes { font: inherit; font-size: var(--f0); color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 6px; padding: 3px 6px; }
#desglose-anio { font: inherit; font-size: var(--f0); color: var(--tinta); background: var(--superficie);
  border: 1px solid var(--linea); border-radius: 6px; padding: 3px 6px; }
#desglose-anio[disabled] { opacity: .45; }
.fiscal-entradas { display: flex; flex-wrap: wrap; gap: calc(var(--u)*2); font-size: var(--f0); color: var(--tinta2); }
.fiscal-entradas label { display: inline-flex; align-items: center; gap: 6px; }
.fiscal-entradas input, .explica input[data-fiscal] { font: inherit; font-size: var(--f0); width: 7.5em;
  color: var(--tinta); background: var(--superficie); border: 1px solid var(--linea);
  border-radius: 6px; padding: 4px 8px; text-align: right; }
.explica input[data-fiscal] { padding: 1px 4px; }

/* ------------------------------------------------------------ responsive --- */
@media (max-width: 900px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .dos-columnas, .tres-columnas { grid-template-columns: 1fr; }
  nav.vistas .pista-vista { display: none; }
}
@media (max-width: 480px) {
  body { padding: calc(var(--u)*2) calc(var(--u)*1.5) calc(var(--u)*6); }
  :root { --alto-fijo: 138px; }
  .kpi .valor { font-size: 1.6rem; }
  .kpi { padding: calc(var(--u)*1.5) calc(var(--u)*1.75); }
  /* la barra pegada no puede comerse el teléfono: cada fila en una línea
     que se desliza a lo ancho */
  nav.periodo { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  nav.periodo::-webkit-scrollbar { display: none; }
  nav.periodo .grupo { flex-wrap: nowrap; }
  nav.periodo select { flex: none; }
  .fila-barra { grid-template-columns: minmax(90px, 12ch) 1fr auto; }
  .fila-barra .delta { display: none; }
  table.datos .ocultable { display: none; }
  nav.periodo .resumen { display: none; }
  nav.vistas button { font-size: var(--f0); padding: var(--u) calc(var(--u)*1.25); }
  section > .pregunta { font-size: 1.25rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  html { scroll-behavior: auto; }
}

body.bloqueado a.saltar { display: none; }
#cerradura { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: var(--fondo); padding: calc(var(--u)*3); }
#cerradura .caja-clave { width: min(380px, 100%); text-align: left; }
#cerradura .marca { display: flex; align-items: center; gap: calc(var(--u)*1.5); margin-bottom: calc(var(--u)*4); }
#cerradura .marca svg { flex: none; }
#cerradura h1 { font-size: var(--f2); font-weight: 650; letter-spacing: -.01em; }
#cerradura p.pista { font-size: var(--f0); color: var(--tinta3); margin-bottom: calc(var(--u)*3); max-width: 40ch; }
#cerradura label { display: block; font-size: var(--f0); color: var(--tinta2); margin-bottom: 6px; }
#cerradura input[type="password"] { width: 100%; font: inherit; font-size: 1rem;
  background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea);
  border-radius: var(--radio); padding: 12px 14px; }
#cerradura input[type="password"]:focus-visible { border-color: var(--acento); }
#cerradura button.abrir { width: 100%; margin-top: calc(var(--u)*2); background: var(--acento); color: var(--acento-tinta);
  font-weight: 600; border-radius: var(--radio); padding: 13px; font-size: var(--f1); }
#cerradura button.abrir[disabled] { opacity: .55; }
#cerradura .recordar { display: flex; align-items: flex-start; gap: 8px; margin-top: calc(var(--u)*2);
  font-size: var(--f0); color: var(--tinta2); }
#cerradura .recordar input { margin-top: 3px; }
#cerradura .error { font-size: var(--f0); color: var(--mal); margin-top: var(--u); min-height: 1.4em; }
#cerradura .nota-pie { font-size: var(--f0); color: var(--tinta3); margin-top: calc(var(--u)*5); max-width: 42ch; }
body.bloqueado { overflow: hidden; }
body.bloqueado > *:not(#cerradura) { display: none; }
</style>

/* ==================== CERRADURA ====================
   Los datos llegan cifrados. Aquí se deriva la clave con PBKDF2 y se
   descifra con AES-GCM en el propio teléfono: la contraseña no viaja a
   ningún sitio, no hay servidor que la valide, no se envía nada a la red. */
(function () {
  'use strict';
  var C = window.__CIFRADO;
  var $ = function (s) { return document.querySelector(s); };
  var b64 = function (t) {
    var bin = atob(t), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  };
  var CLAVE_GUARDADA = 'panel.claveDispositivo';

  function pinta(msg) { $('#cerradura .error').textContent = msg || ''; }

  async function derivar(pass) {
    var material = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(C.sal), iterations: C.iter, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function abrirCon(clave) {
    var plano = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(C.iv) }, clave, b64(C.datos));
    /* el JSON viaja comprimido: pesa la cuarta parte en el móvil */
    var texto;
    if (typeof DecompressionStream === 'function') {
      var flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
      texto = await new Response(flujo).text();
    } else {
      throw new Error('navegador-antiguo');
    }
    var sobre = JSON.parse(texto);
    window.__D = sobre.d;
    /* el código venía dentro del sobre cifrado y AES-GCM garantiza que es
       el nuestro sin tocar: si alguien lo alterase, no habríamos llegado
       hasta aquí porque el descifrado fallaría */
    (new Function(sobre.js))();
    document.body.classList.remove('bloqueado');
    var c = $('#cerradura');
    if (c) c.remove();
    window.__arrancarPanel();
  }

  async function intentar(pass, recordar) {
    var boton = $('#cerradura button.abrir');
    boton.disabled = true;
    boton.textContent = 'Abriendo…';
    pinta('');
    try {
      var clave = await derivar(pass);
      await abrirCon(clave);
      if (recordar) {
        var bruta = await crypto.subtle.exportKey('raw', clave);
        var arr = Array.from(new Uint8Array(bruta));
        try { localStorage.setItem(CLAVE_GUARDADA, JSON.stringify(arr)); } catch (e) {}
      } else {
        try { localStorage.removeItem(CLAVE_GUARDADA); } catch (e) {}
      }
    } catch (err) {
      boton.disabled = false;
      boton.textContent = 'Abrir el panel';
      if (err && err.message === 'navegador-antiguo')
        pinta('Este navegador es demasiado antiguo para abrir el panel. Prueba con otro.');
      else pinta('Contraseña incorrecta.');
      var inp = $('#cerradura input[type="password"]');
      inp.select();
    }
  }

  /* si el dispositivo ya está recordado, se abre sin preguntar */
  async function intentarGuardada() {
    var guardada = null;
    try { guardada = localStorage.getItem(CLAVE_GUARDADA); } catch (e) {}
    if (!guardada) return false;
    try {
      var arr = new Uint8Array(JSON.parse(guardada));
      var clave = await crypto.subtle.importKey('raw', arr, 'AES-GCM', true, ['decrypt']);
      await abrirCon(clave);
      return true;
    } catch (e) {
      try { localStorage.removeItem(CLAVE_GUARDADA); } catch (e2) {}
      return false;
    }
  }

  window.addEventListener('DOMContentLoaded', async function () {
    if (await intentarGuardada()) return;
    var form = $('#cerradura form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pass = $('#cerradura input[type="password"]').value;
      if (pass) intentar(pass, $('#cerradura .recordar input').checked);
    });
    $('#cerradura input[type="password"]').focus();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
